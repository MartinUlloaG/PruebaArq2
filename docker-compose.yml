services:
  base-de-datos:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data

  # Broker de mensajes para la Saga. Un solo nodo en modo KRaft (sin ZooKeeper).
  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT: para los servicios en Windows. INTERNA: para otros contenedores (Kafka UI).
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNA://:29092,CONTROLLER://:9093
      # 127.0.0.1 y no localhost, por lo mismo que con Postgres (Windows prueba IPv6 primero)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092,INTERNA://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNA
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNA:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Los mensajes se guardan en el volumen: si se reinicia el contenedor no se pierden.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - datos_kafka:/var/lib/kafka/data

  # Para VER Kafka en el navegador (http://127.0.0.1:8080): tópicos, mensajes y grupos.
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: tienda
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "127.0.0.1:8080:8080"

  # Catálogo (modelo de lectura de CQRS): documentos con categoría y atributos de cada prenda.
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - datos_mongo:/data/db

volumes:
  datos_postgres:
  datos_kafka:
  datos_mongo:
